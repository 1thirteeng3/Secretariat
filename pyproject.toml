[project]
name = "pandaemon"
version = "1.0.0"
description = "A cognitive daemon system - local-first AI assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Giovanni Barcelos" }]

dependencies = [
    # Core Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    
    # LLM Providers
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    "openai>=1.50.0",  # For DeepSeek (OpenAI-compatible API)
    
    # Vector Database & Embeddings
    "chromadb>=0.5.0",
    "sentence-transformers>=3.3.0",
    
    # Spotify Integration (Unofficial - uses cookies)
    "spotapi>=1.2.0",
    
    # Telegram Integration
    "python-telegram-bot>=21.0",
    
    # Browser Automation
    "browser-use>=0.1.0",
    "playwright>=1.48.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.0",
    "unidecode>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pandaemon"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
